name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in the official OpenWrt SDK
        run: |
          mkdir -p output
          docker run --rm \
            -v "$PWD:/builder/package/gost:ro" \
            -v "$PWD/output:/output" \
            ghcr.io/openwrt/sdk:mediatek-filogic-openwrt-25.12 \
            sh -ec '
              [ -d scripts ] || ./setup.sh
              ./scripts/feeds update packages
              ./scripts/feeds install golang
              printf "CONFIG_PACKAGE_gost=m\\n" > .config
              make defconfig
              make package/gost/compile V=s -j"$(nproc)"
              cp bin/packages/*/*/gost-*.apk /output/
            '
      - uses: actions/upload-artifact@v4
        with:
          name: gost-aarch64-openwrt-25.12
          path: output/gost-*.apk
